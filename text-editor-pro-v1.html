<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Text Editor</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #f0f0f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #toolbar {
    background: #2b2b2b;
    color: #fff;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #toolbar button {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    background: #4a90e2;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  #toolbar button:hover { background: #357abd; }
  .colorGroup {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  #filename {
    margin-left: auto;
    font-size: 14px;
    opacity: 0.9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }
  #editor {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 20px;
    font-size: 16px;
    font-family: Consolas, "Courier New", monospace;
    background: #ffffff;
    color: #000000;
  }
  input[type="file"] { display: none; }
  input[type="text"] {
    padding: 5px 8px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #1e1e1e;
    color: #fff;
    font-size: 13px;
    width: 160px;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="loadBtn">Load File</button>
  <input type="file" id="fileInput" accept=".txt,.md,.js,.html,.css,.json,.csv,text/*">
  <button id="saveBtn">Save File</button>

  <div class="colorGroup">
    <label for="filenameInput">Filename</label>
    <input type="text" id="filenameInput" placeholder="untitled.txt">
  </div>

  <div class="colorGroup">
    <label for="bgColor">Background</label>
    <input type="color" id="bgColor" value="#ffffff">
  </div>

  <div class="colorGroup">
    <label for="textColor">Text</label>
    <input type="color" id="textColor" value="#000000">
  </div>

  <div id="filename">No file loaded</div>
</div>

<textarea id="editor" spellcheck="false" placeholder="Start typing..."></textarea>

<script>
  const editor = document.getElementById('editor');
  const fileInput = document.getElementById('fileInput');
  const loadBtn = document.getElementById('loadBtn');
  const saveBtn = document.getElementById('saveBtn');
  const bgColor = document.getElementById('bgColor');
  const textColor = document.getElementById('textColor');
  const filenameDisplay = document.getElementById('filename');
  const filenameInput = document.getElementById('filenameInput');

  let currentFilename = null;
  let isEdited = false;

  function updateFilenameDisplay() {
    if (!currentFilename) {
      filenameDisplay.textContent = 'No file loaded';
      return;
    }
    filenameDisplay.textContent = currentFilename + (isEdited ? ' *' : '');
  }

  loadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      editor.value = event.target.result;
      currentFilename = file.name;
      filenameInput.value = file.name;
      isEdited = false;
      updateFilenameDisplay();
    };
    reader.readAsText(file);

    // reset input so selecting the same file again still fires 'change'
    fileInput.value = '';
  });

  saveBtn.addEventListener('click', () => {
    const nameToSave = filenameInput.value.trim() || currentFilename || 'untitled.txt';
    currentFilename = nameToSave;
    filenameInput.value = nameToSave;
    const blob = new Blob([editor.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = nameToSave;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // treat save as "clean" state
    if (currentFilename) {
      isEdited = false;
      updateFilenameDisplay();
    }
  });

  editor.addEventListener('input', () => {
    if (currentFilename && !isEdited) {
      isEdited = true;
      updateFilenameDisplay();
    }
  });

  filenameInput.addEventListener('input', () => {
    currentFilename = filenameInput.value.trim();
    updateFilenameDisplay();
  });

  bgColor.addEventListener('input', () => {
    editor.style.backgroundColor = bgColor.value;
  });

  textColor.addEventListener('input', () => {
    editor.style.color = textColor.value;
  });
</script>

</body>
</html>
