<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Capture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #161a23;
    --panel:     #1e2330;
    --border:    #2a3045;
    --accent:    #4f9eff;
    --accent2:   #7b5ea7;
    --danger:    #e05c5c;
    --warning:   #e09a3a;
    --success:   #4fc98a;
    --text:      #e8ecf4;
    --muted:     #7a849a;
    --sel-color: #4f9eff;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 24px;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: grid; place-items: center;
  }
  .logo-icon svg { width: 20px; height: 20px; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }

  /* ── Mode toggle ── */
  .mode-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .mode-btn {
    padding: 8px 22px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    display: flex; align-items: center; gap: 7px;
  }
  .mode-btn.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 4px #0004;
  }
  .mode-btn svg { width: 15px; height: 15px; }

  /* ── Main card ── */
  .card {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
  }

  /* ── Preview area ── */
  .preview-wrap {
    position: relative;
    background: #090b10;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: crosshair;
  }
  #preview {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
    pointer-events: none;
    user-select: none;
  }
  .idle-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.85rem;
    pointer-events: none;
    user-select: none;
  }
  .idle-hint svg { width: 40px; height: 40px; opacity: .35; }

  /* Selection box */
  #sel-box {
    position: absolute;
    border: 2px solid var(--sel-color);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45), 0 0 12px rgba(79,158,255,0.4);
    display: none;
    pointer-events: none;
  }
  #sel-box::before {
    content: '';
    position: absolute;
    inset: -1px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 1px;
  }
  /* Corner handles */
  #sel-box .h {
    position: absolute;
    width: 10px; height: 10px;
    background: var(--sel-color);
    border-radius: 2px;
  }
  #sel-box .h.tl { top: -5px; left: -5px; }
  #sel-box .h.tr { top: -5px; right: -5px; }
  #sel-box .h.bl { bottom: -5px; left: -5px; }
  #sel-box .h.br { bottom: -5px; right: -5px; }

  /* Dimension badge */
  #dim-badge {
    position: absolute;
    top: -26px; left: 0;
    background: var(--accent);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
    display: none;
  }

  /* ── Controls bar ── */
  .controls {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .controls-left { display: flex; gap: 10px; align-items: center; }
  .controls-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 0.83rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:not(:disabled):hover { background: #3a8df0; }

  .btn-ghost {
    background: var(--panel);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-ghost:not(:disabled):hover { background: #252b3a; }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }
  .btn-danger:not(:disabled):hover { background: rgba(224,92,92,.1); }

  .btn-warning {
    background: transparent;
    color: var(--warning);
    border-color: var(--warning);
  }
  .btn-warning:not(:disabled):hover { background: rgba(224,154,58,.1); }

  .btn-success {
    background: var(--success);
    color: #0d0f14;
    border-color: var(--success);
  }
  .btn-success:not(:disabled):hover { background: #3ab878; }

  /* REC badge */
  .rec-badge {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--danger);
    letter-spacing: .04em;
  }
  .rec-badge .dot {
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    animation: blink 1s step-start infinite;
  }
  .rec-badge.paused .dot { animation: none; opacity: .4; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Timer */
  #timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--muted);
    min-width: 48px;
    display: none;
  }

  /* Status bar */
  .status-bar {
    padding: 9px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    min-height: 36px;
  }
  .status-bar .dot-status {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-bar.ok .dot-status  { background: var(--success); }
  .status-bar.rec .dot-status { background: var(--danger); animation: blink 1s step-start infinite; }
  .status-bar.warn .dot-status { background: var(--warning); }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 22px;
    border-radius: 12px;
    font-size: 0.85rem;
    box-shadow: 0 8px 32px #0006;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* help note */
  .help-note {
    font-size: 0.77rem;
    color: var(--muted);
    text-align: center;
    max-width: 520px;
    line-height: 1.6;
  }
  .help-note kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
    </svg>
  </div>
  <h1>Screen<span>Capture</span></h1>
</header>

<!-- Mode toggle -->
<div class="mode-toggle">
  <button class="mode-btn active" id="btn-video-mode" onclick="setMode('video')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    Video
  </button>
  <button class="mode-btn" id="btn-photo-mode" onclick="setMode('photo')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Photo
  </button>
</div>

<!-- Main card -->
<div class="card">
  <!-- Preview / selection area -->
  <div class="preview-wrap" id="preview-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div class="idle-hint" id="idle-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      <span>Click <strong>Share Screen</strong> to begin</span>
    </div>
    <!-- Selection box -->
    <div id="sel-box">
      <div class="h tl"></div><div class="h tr"></div>
      <div class="h bl"></div><div class="h br"></div>
      <div id="dim-badge"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="controls-left">
      <!-- Share screen -->
      <button class="btn btn-ghost" id="btn-share" onclick="startCapture()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        Share Screen
      </button>

      <!-- Video controls -->
      <button class="btn btn-primary" id="btn-start" onclick="startRecording()" disabled style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        Start
      </button>
      <button class="btn btn-warning" id="btn-pause" onclick="togglePause()" disabled style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        Pause
      </button>
      <button class="btn btn-danger" id="btn-stop" onclick="stopRecording()" disabled style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Stop
      </button>

      <!-- Photo control -->
      <button class="btn btn-success" id="btn-photo" onclick="takePhoto()" disabled style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Take Photo
      </button>

      <!-- REC badge + timer -->
      <span class="rec-badge" id="rec-badge"><span class="dot"></span> REC</span>
      <span id="timer">00:00</span>
    </div>

    <div class="controls-right">
      <button class="btn btn-ghost" id="btn-clear-sel" onclick="clearSelection()" disabled title="Clear selection box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        Clear Region
      </button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status-bar">
    <span class="dot-status"></span>
    <span id="status-text">Idle — share your screen to begin</span>
  </div>
</div>

<p class="help-note">
  After sharing, drag a <strong>rectangle region</strong> on the preview to select the capture area.
  Leave undrawn to capture the full stream. <kbd>Esc</kbd> clears selection.
</p>

<div id="toast"></div>

<!-- hidden canvas for photo crop -->
<canvas id="canvas" style="display:none"></canvas>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let mode          = 'video';
let stream        = null;
let mediaRecorder = null;
let cropAnimId    = null;
let chunks        = [];
let recState      = 'idle';   // idle | recording | paused
let timerInt      = null;
let elapsed       = 0;
let selection     = null;     // { x, y, w, h } fractions of video content area

// ── UI helpers ────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setStatus(msg, type = '') {
  $('status-text').textContent = msg;
  $('status-bar').className = 'status-bar' + (type ? ' ' + type : '');
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function setMode(m) {
  mode = m;
  $('btn-video-mode').classList.toggle('active', m === 'video');
  $('btn-photo-mode').classList.toggle('active', m === 'photo');
  const isVideo = m === 'video';
  $('btn-start').style.display  = isVideo ? '' : 'none';
  $('btn-pause').style.display  = isVideo ? '' : 'none';
  $('btn-stop').style.display   = isVideo ? '' : 'none';
  $('btn-photo').style.display  = isVideo ? 'none' : '';
  $('rec-badge').style.display  = 'none';
  $('timer').style.display      = 'none';
  if (!stream) return;
  $('btn-start').disabled = (isVideo && recState !== 'idle') ? true : !isVideo;
  $('btn-photo').disabled = isVideo;
  setStatus('Ready — draw a region or capture full screen', 'ok');
}

// ── Screen share ──────────────────────────────────────────────────────────
async function startCapture() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'always' }, audio: false });
    const vid = $('preview');
    vid.srcObject = stream;
    vid.style.display = 'block';
    $('idle-hint').style.display = 'none';
    stream.getVideoTracks()[0].addEventListener('ended', () => { resetAll(); setStatus('Screen share ended', ''); });

    if (mode === 'video') $('btn-start').disabled = false;
    else $('btn-photo').disabled = false;

    $('btn-share').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Change Source`;
    setStatus('Screen shared — draw a region or capture full screen', 'ok');
    toast('Screen shared! Draw a region to select an area.');
  } catch(e) {
    if (e.name !== 'NotAllowedError') setStatus('Could not access screen: ' + e.message, 'warn');
  }
}

// ── Selection helpers ─────────────────────────────────────────────────────
// Returns the rendered content rect of the <video> accounting for object-fit:contain
function getVideoContentRect() {
  const vid  = $('preview');
  const el   = vid.getBoundingClientRect();
  const vW   = vid.videoWidth  || el.width;
  const vH   = vid.videoHeight || el.height;
  const eR   = el.width / el.height;
  const vR   = vW / vH;
  let cW, cH, cX, cY;
  if (vR > eR) { cW = el.width;  cH = el.width  / vR; cX = 0; cY = (el.height - cH) / 2; }
  else         { cH = el.height; cW = el.height * vR;  cY = 0; cX = (el.width  - cW) / 2; }
  return { left: el.left + cX, top: el.top + cY, width: cW, height: cH };
}

// Convert selection fractions → real video pixel rect
function selectionToPixels() {
  const vid = $('preview');
  return {
    sx: Math.round(selection.x * vid.videoWidth),
    sy: Math.round(selection.y * vid.videoHeight),
    sw: Math.round(selection.w * vid.videoWidth),
    sh: Math.round(selection.h * vid.videoHeight)
  };
}

// ── Selection drawing ─────────────────────────────────────────────────────
let drawing = false, startX = 0, startY = 0;
const wrap     = $('preview-wrap');
const selBox   = $('sel-box');
const dimBadge = $('dim-badge');

wrap.addEventListener('mousedown', e => {
  if (!stream) return;
  const cr   = getVideoContentRect();
  const mx   = e.clientX - cr.left;
  const my   = e.clientY - cr.top;
  if (mx < 0 || my < 0 || mx > cr.width || my > cr.height) return;
  drawing = true;
  startX  = mx;
  startY  = my;
  const wr = wrap.getBoundingClientRect();
  selBox.style.cssText = `display:block; left:${cr.left - wr.left + mx}px; top:${cr.top - wr.top + my}px; width:0; height:0`;
  dimBadge.style.display = 'none';
  selection = null;
  $('btn-clear-sel').disabled = false;
});

wrap.addEventListener('mousemove', e => {
  if (!drawing) return;
  const cr  = getVideoContentRect();
  const mx  = Math.min(Math.max(e.clientX - cr.left, 0), cr.width);
  const my  = Math.min(Math.max(e.clientY - cr.top,  0), cr.height);
  const dx  = mx - startX;
  const dy  = my - startY;
  const x   = dx < 0 ? startX + dx : startX;
  const y   = dy < 0 ? startY + dy : startY;
  const w   = Math.abs(dx);
  const h   = Math.abs(dy);
  const wr  = wrap.getBoundingClientRect();
  selBox.style.left   = (cr.left - wr.left + x) + 'px';
  selBox.style.top    = (cr.top  - wr.top  + y) + 'px';
  selBox.style.width  = w + 'px';
  selBox.style.height = h + 'px';
  const vid = $('preview');
  dimBadge.style.display = 'block';
  dimBadge.textContent = Math.round(w * vid.videoWidth / cr.width) + ' × ' + Math.round(h * vid.videoHeight / cr.height);
});

wrap.addEventListener('mouseup', () => {
  if (!drawing) return;
  drawing = false;
  const w = parseFloat(selBox.style.width);
  const h = parseFloat(selBox.style.height);
  if (w < 10 || h < 10) { clearSelection(); return; }
  const cr  = getVideoContentRect();
  const wr  = wrap.getBoundingClientRect();
  const slx = parseFloat(selBox.style.left) - (cr.left - wr.left);
  const sly = parseFloat(selBox.style.top)  - (cr.top  - wr.top);
  selection = { x: slx / cr.width, y: sly / cr.height, w: w / cr.width, h: h / cr.height };
  setStatus('Region selected — ready to capture', 'ok');
});

// Also end drag if mouse leaves window
document.addEventListener('mouseup', () => {
  if (drawing) {
    drawing = false;
    const w = parseFloat(selBox.style.width);
    const h = parseFloat(selBox.style.height);
    if (w < 10 || h < 10) { clearSelection(); return; }
    const cr  = getVideoContentRect();
    const wr  = wrap.getBoundingClientRect();
    const slx = parseFloat(selBox.style.left) - (cr.left - wr.left);
    const sly = parseFloat(selBox.style.top)  - (cr.top  - wr.top);
    selection = { x: slx / cr.width, y: sly / cr.height, w: w / cr.width, h: h / cr.height };
    setStatus('Region selected — ready to capture', 'ok');
  }
});

function clearSelection() {
  selection = null;
  selBox.style.display = 'none';
  dimBadge.style.display = 'none';
  $('btn-clear-sel').disabled = true;
  if (stream) setStatus('No region — full stream will be captured', 'ok');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') clearSelection(); });

// ── Canvas crop stream ────────────────────────────────────────────────────
// Draws the selected region into a hidden canvas and returns its stream.
// Must be called BEFORE creating MediaRecorder so the stream is ready.
function buildCroppedStream() {
  const vid        = $('preview');
  const { sx, sy, sw, sh } = selectionToPixels();
  const cvs        = document.createElement('canvas');
  cvs.width        = sw;
  cvs.height       = sh;
  const ctx        = cvs.getContext('2d');
  // Prime the canvas with one frame immediately so the stream has content
  ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);

  function drawFrame() {
    ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);
    cropAnimId = requestAnimationFrame(drawFrame);
  }
  cropAnimId = requestAnimationFrame(drawFrame);
  return cvs.captureStream(30);
}

// ── Video recording ───────────────────────────────────────────────────────
function getSupportedMime() {
  const candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return candidates.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch(e){ return false; } }) || '';
}

function startRecording() {
  if (!stream || recState !== 'idle') return;

  // Build canvas crop stream FIRST (before MediaRecorder)
  const captureStream = selection ? buildCroppedStream() : stream;

  const mime = getSupportedMime();
  chunks = [];

  try {
    mediaRecorder = new MediaRecorder(captureStream, mime ? { mimeType: mime } : {});
  } catch(e) {
    try { mediaRecorder = new MediaRecorder(captureStream); }
    catch(e2) { setStatus('Recording not supported: ' + e2.message, 'warn'); cancelAnimationFrame(cropAnimId); return; }
  }

  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => { cancelAnimationFrame(cropAnimId); cropAnimId = null; saveVideo(); };
  mediaRecorder.start(200);

  recState = 'recording';
  $('btn-start').disabled = true;
  $('btn-pause').disabled = false;
  $('btn-stop').disabled  = false;
  $('rec-badge').style.display = 'flex';
  $('rec-badge').classList.remove('paused');
  $('timer').style.display = 'inline';
  elapsed = 0; updateTimer();
  timerInt = setInterval(() => { elapsed++; updateTimer(); }, 1000);
  setStatus('Recording…', 'rec');
}

function togglePause() {
  if (!mediaRecorder) return;
  if (recState === 'recording') {
    mediaRecorder.pause();
    recState = 'paused';
    clearInterval(timerInt);
    $('btn-pause').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><polygon points="5 3 19 12 5 21 5 3"/></svg> Resume`;
    $('rec-badge').classList.add('paused');
    setStatus('Paused', 'warn');
  } else if (recState === 'paused') {
    mediaRecorder.resume();
    recState = 'recording';
    timerInt = setInterval(() => { elapsed++; updateTimer(); }, 1000);
    $('btn-pause').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause`;
    $('rec-badge').classList.remove('paused');
    setStatus('Recording…', 'rec');
  }
}

function stopRecording() {
  if (!mediaRecorder) return;
  clearInterval(timerInt);
  mediaRecorder.stop();   // onstop handler cancels cropAnimId and calls saveVideo
  recState = 'idle';
  $('btn-start').disabled = false;
  $('btn-pause').disabled = true;
  $('btn-stop').disabled  = true;
  $('rec-badge').style.display = 'none';
  $('timer').style.display = 'none';
  $('btn-pause').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause`;
  setStatus('Processing video…', '');
}

function saveVideo() {
  const mime  = (mediaRecorder && mediaRecorder.mimeType) || 'video/webm';
  const ext   = mime.includes('mp4') ? 'mp4' : 'webm';
  const blob  = new Blob(chunks, { type: mime });
  const url   = URL.createObjectURL(blob);
  const a     = document.createElement('a');
  a.href      = url;
  a.download  = 'capture_' + timestamp() + '.' + ext;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  setStatus('Video saved to Downloads (' + ext.toUpperCase() + ')', 'ok');
  toast('📹 Video saved to Downloads!');
}

// ── Photo capture ─────────────────────────────────────────────────────────
function takePhoto() {
  if (!stream) return;
  const vid = $('preview');
  const cvs = $('canvas');
  let sx = 0, sy = 0, sw = vid.videoWidth, sh = vid.videoHeight;
  if (selection) { const p = selectionToPixels(); sx = p.sx; sy = p.sy; sw = p.sw; sh = p.sh; }
  cvs.width = sw; cvs.height = sh;
  cvs.getContext('2d').drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);
  cvs.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href    = url; a.download = 'capture_' + timestamp() + '.jpg'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setStatus('Photo saved to Downloads (JPG)', 'ok');
    toast('📸 Photo saved to Downloads!');
  }, 'image/jpeg', 0.95);
}

// ── Utilities ─────────────────────────────────────────────────────────────
function updateTimer() {
  $('timer').textContent = String(Math.floor(elapsed/60)).padStart(2,'0') + ':' + String(elapsed%60).padStart(2,'0');
}
function timestamp() {
  const d = new Date();
  return [d.getFullYear(), d.getMonth()+1, d.getDate()].map(n=>String(n).padStart(2,'0')).join('') +
    '_' + [d.getHours(), d.getMinutes(), d.getSeconds()].map(n=>String(n).padStart(2,'0')).join('');
}

function resetAll() {
  if (timerInt)    clearInterval(timerInt);
  if (cropAnimId)  cancelAnimationFrame(cropAnimId);
  cropAnimId = null; mediaRecorder = null; chunks = []; recState = 'idle'; elapsed = 0; stream = null;
  $('preview').style.display = 'none'; $('preview').srcObject = null;
  $('idle-hint').style.display = '';
  $('btn-start').disabled = true; $('btn-pause').disabled = true;
  $('btn-stop').disabled  = true; $('btn-photo').disabled = true;
  $('rec-badge').style.display = 'none'; $('timer').style.display = 'none';
  clearSelection();
  $('btn-share').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Share Screen`;
}

// ── Init ──────────────────────────────────────────────────────────────────
setMode('video');
setStatus('Idle — share your screen to begin', '');
</script>
</body>
