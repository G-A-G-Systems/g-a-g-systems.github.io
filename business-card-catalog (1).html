<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Catalog — Business Card Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E7;
    --paper-card:#FBF8F2;
    --ink:#20293A;
    --ink-soft:#5B6472;
    --line:#D9CFBC;
    --brass:#A8783B;
    --brass-dark:#8A6129;
    --tab-red:#B5533C;
    --shadow: 0 10px 30px -12px rgba(32,41,58,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 10% -10%, #FFFDF8 0%, transparent 60%),
      var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding:32px 20px 60px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  header.top{ margin-bottom:28px; }
  .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass-dark); font-weight:600; margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:38px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{ color:var(--ink-soft); font-size:14.5px; max-width:52ch; line-height:1.5; }

  .filebar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    margin:22px 0 30px;
    padding:14px 16px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:12px;
  }
  .filebar .status{
    font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:7px;
    margin-right:auto;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#B7B0A0; flex-shrink:0; }
  .dot.linked{ background:#4C8A5E; }
  .dot.unsaved{ background:var(--tab-red); }

  button{
    font-family:'Inter', sans-serif;
    cursor:pointer;
    border-radius:9px;
    border:1px solid transparent;
    font-size:13.5px;
    font-weight:600;
    padding:9px 14px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-ghost{
    background:transparent;
    border-color:var(--line);
    color:var(--ink);
  }
  .btn-ghost:hover{ background:#EFE8D8; }
  .btn-brass{
    background:var(--brass);
    color:#FBF8F2;
  }
  .btn-brass:hover{ background:var(--brass-dark); }
  .btn-outline-red{
    background:transparent;
    border-color:#E2B7AA;
    color:var(--tab-red);
  }
  .btn-outline-red:hover{ background:#FBEEEA; }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  /* The index card itself — the signature element */
  .card{
    position:relative;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:4px 10px 10px 10px;
    box-shadow:var(--shadow);
    padding:34px 32px 28px;
  }
  .tab{
    position:absolute;
    top:-16px; left:28px;
    background:var(--tab-red);
    color:#FBF3EF;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:14px;
    width:38px; height:30px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px 6px 3px 3px;
    box-shadow:0 4px 10px -3px rgba(181,83,60,0.5);
  }
  .card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px dashed #E4DAC5;
    border-radius:3px;
    pointer-events:none;
  }
  .card-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px; gap:12px; flex-wrap:wrap;
  }
  .card-head h2{
    font-family:'Fraunces', serif; font-size:20px; margin:0; font-weight:600;
  }
  .edit-flag{
    font-size:12px; color:var(--brass-dark); font-weight:600;
    background:#F1E6D2; padding:4px 10px; border-radius:20px;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:10px 12px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#FFFDF9;
    color:var(--ink);
    outline:none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field textarea{ resize:vertical; min-height:56px; font-family:inherit; }
  .field input:focus, .field textarea:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(168,120,59,0.15);
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:520px){ .grid2{ grid-template-columns:1fr; } }

  .card-actions{
    display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;
    border-top:1px solid var(--line); padding-top:20px;
  }

  .browse-row{
    display:flex; justify-content:space-between; align-items:center;
    margin:26px 0 12px;
  }
  .browse-row .count{ font-size:13px; color:var(--ink-soft); }

  /* dialog */
  dialog{
    border:none; border-radius:14px; padding:0;
    width:min(480px, 92vw);
    box-shadow:var(--shadow);
    background:var(--paper-card);
  }
  dialog::backdrop{ background:rgba(32,41,58,0.45); backdrop-filter: blur(1px); }
  .dlg-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--line);
  }
  .dlg-head h3{ font-family:'Fraunces', serif; margin:0; font-size:18px; }
  .dlg-close{
    background:transparent; border:none; font-size:20px; line-height:1;
    color:var(--ink-soft); padding:4px 8px; border-radius:6px;
  }
  .dlg-close:hover{ background:#EFE8D8; }
  .dlg-search{ padding:14px 20px 0; }
  .dlg-search input{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
    font-size:14px; font-family:inherit; background:#FFFDF9;
  }
  .dlg-list{
    list-style:none; margin:0; padding:10px 10px 18px; max-height:360px; overflow-y:auto;
  }
  .dlg-list li{ margin:2px 0; }
  .dlg-list button{
    width:100%; text-align:left; background:transparent; border:none;
    padding:10px 12px; border-radius:8px; font-weight:500; font-size:14.5px; color:var(--ink);
    display:flex; justify-content:space-between; gap:8px;
  }
  .dlg-list button:hover{ background:#F1E6D2; }
  .dlg-list .type{ color:var(--ink-soft); font-weight:400; font-size:12.5px; }
  .empty{ padding:24px 20px; color:var(--ink-soft); font-size:14px; text-align:center; }

  .hint{ font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }
  a.hint-link{ color:var(--brass-dark); }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">Card Catalog</div>
    <h1>Business Card Manager</h1>
    <p class="sub">Keep contact cards for the businesses you deal with — saved as a single file in your Downloads folder, so it's there the next time you open this page.</p>
  </header>

  <div class="filebar">
    <div class="status" id="fileStatus"><span class="dot" id="statusDot"></span><span id="statusText">No file connected yet</span></div>
    <button class="btn-ghost" id="btnOpenFile">Open existing file</button>
    <button class="btn-ghost" id="btnNewFile">Start new file</button>
    <input type="file" id="fallbackInput" accept="application/json" class="visually-hidden">
  </div>

  <div class="card">
    <div class="tab" id="cardTab">＋</div>
    <div class="card-head">
      <h2 id="cardHeading">New Card</h2>
      <span class="edit-flag" id="editFlag" style="display:none;">Editing existing card</span>
    </div>

    <div class="field">
      <label for="f-name">Business name</label>
      <input id="f-name" type="text" placeholder="e.g. Harbor & Vine Coffee Roasters">
    </div>

    <div class="field">
      <label for="f-type">Type of business</label>
      <input id="f-type" type="text" placeholder="e.g. Coffee Roaster & Café">
    </div>

    <div class="grid2">
      <div class="field">
        <label for="f-phone">Telephone</label>
        <input id="f-phone" type="tel" placeholder="e.g. +61 2 5550 1234">
      </div>
      <div class="field">
        <label for="f-email">Email</label>
        <input id="f-email" type="email" placeholder="e.g. hello@harborvine.com">
      </div>
    </div>

    <div class="field">
      <label for="f-website">Website</label>
      <input id="f-website" type="text" placeholder="e.g. www.harborvine.com">
    </div>

    <div class="field">
      <label for="f-address">Business address</label>
      <textarea id="f-address" placeholder="Street, suburb, state, postcode"></textarea>
    </div>

    <div class="card-actions">
      <button class="btn-brass" id="btnSave">Save card</button>
      <button class="btn-ghost" id="btnClear">New card</button>
      <button class="btn-outline-red" id="btnDelete" style="display:none;">Delete card</button>
    </div>
  </div>

  <div class="browse-row">
    <span class="count" id="recordCount">0 cards saved</span>
    <button class="btn-ghost" id="btnAllRecords">All records</button>
  </div>

  <p class="hint" id="supportHint"></p>

  <dialog id="recordsDialog">
    <div class="dlg-head">
      <h3>All records</h3>
      <button class="dlg-close" id="btnCloseDialog" aria-label="Close">×</button>
    </div>
    <div class="dlg-search">
      <input type="text" id="dlgSearch" placeholder="Filter by business name...">
    </div>
    <ul class="dlg-list" id="dlgList"></ul>
  </dialog>

</div>

<script>
(function(){
  let supportsFS = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;

  // The File System Access API also requires the page to be a top-level,
  // same-origin browsing context. When this file is embedded in an iframe
  // (e.g. previewed inside another site, like Claude's artifact panel),
  // the API exists so the feature-detect passes, but every call throws a
  // SecurityError. Detect that up front and fall back gracefully.
  try{
    if(supportsFS && window.top !== window.self){
      supportsFS = false;
    }
  }catch(e){
    // Accessing window.top threw a cross-origin error — definitely framed.
    supportsFS = false;
  }

  let fileHandle = null;
  let records = [];
  let editingIndex = -1;
  let dirty = false;

  const els = {
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    btnOpenFile: document.getElementById('btnOpenFile'),
    btnNewFile: document.getElementById('btnNewFile'),
    fallbackInput: document.getElementById('fallbackInput'),
    name: document.getElementById('f-name'),
    type: document.getElementById('f-type'),
    phone: document.getElementById('f-phone'),
    email: document.getElementById('f-email'),
    website: document.getElementById('f-website'),
    address: document.getElementById('f-address'),
    btnSave: document.getElementById('btnSave'),
    btnClear: document.getElementById('btnClear'),
    btnDelete: document.getElementById('btnDelete'),
    cardHeading: document.getElementById('cardHeading'),
    cardTab: document.getElementById('cardTab'),
    editFlag: document.getElementById('editFlag'),
    recordCount: document.getElementById('recordCount'),
    btnAllRecords: document.getElementById('btnAllRecords'),
    dialog: document.getElementById('recordsDialog'),
    btnCloseDialog: document.getElementById('btnCloseDialog'),
    dlgList: document.getElementById('dlgList'),
    dlgSearch: document.getElementById('dlgSearch'),
    supportHint: document.getElementById('supportHint'),
  };

  // ---------- support hint ----------
  if(supportsFS){
    els.supportHint.innerHTML = 'Your data is stored in a single JSON file. Choose "Start new file" the first time and save it in Downloads, then "Open existing file" to load it again on future visits.';
  } else {
    els.btnNewFile.style.display = 'none';
    els.supportHint.innerHTML = 'Your browser doesn\'t support direct file editing, so "Open existing file" loads a JSON file you pick, and every save downloads an updated copy to your Downloads folder — pick the newest one next time you load.';
  }

  // ---------- status ----------
  function setStatus(mode, text){
    els.statusDot.className = 'dot' + (mode ? ' ' + mode : '');
    els.statusText.textContent = text;
  }
  function markDirty(){
    dirty = true;
    if(!fileHandle && !supportsFS){
      setStatus('unsaved', 'Unsaved changes — click "Save & download" to update your file');
    } else if(fileHandle){
      setStatus('unsaved', 'Saving…');
    }
  }

  // ---------- persistence: File System Access API ----------
  async function writeToHandle(){
    if(!fileHandle) return;
    try{
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(records, null, 2));
      await writable.close();
      dirty = false;
      setStatus('linked', 'Connected to "' + fileHandle.name + '" — all changes saved');
    }catch(err){
      console.error(err);
      setStatus('unsaved', 'Could not save to file — check permissions and try again');
    }
  }

  async function openExistingFile(){
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Business card catalog', accept: {'application/json': ['.json']} }],
        multiple: false
      });
      fileHandle = handle;
      const file = await fileHandle.getFile();
      const text = await file.text();
      try{
        records = text.trim() ? JSON.parse(text) : [];
        if(!Array.isArray(records)) records = [];
      }catch(e){
        alert('That file isn\'t a valid catalog file — starting with an empty list instead.');
        records = [];
      }
      setStatus('linked', 'Connected to "' + fileHandle.name + '" — all changes saved');
      renderCount();
    }catch(err){
      if(err.name === 'AbortError') return;
      console.error(err);
      if(isBlockedByFraming(err)){
        fallBackToDownloadMode();
        els.fallbackInput.click();
      }
    }
  }

  async function startNewFile(){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: 'business-cards.json',
        types: [{ description: 'Business card catalog', accept: {'application/json': ['.json']} }],
        startIn: 'downloads'
      });
      fileHandle = handle;
      records = [];
      await writeToHandle();
      renderCount();
      clearForm();
    }catch(err){
      if(err.name === 'AbortError') return;
      console.error(err);
      if(isBlockedByFraming(err)){
        fallBackToDownloadMode();
        alert('This page is running inside a frame, which blocks direct file access. Switched to download mode instead — use "Open existing file" to load a JSON file, and "Save card" will download an updated copy each time.');
      }
    }
  }

  // If a file-picker call fails with a permissions/security error, it's
  // almost always because the page is embedded in an iframe. Switch the
  // whole UI over to the upload/download fallback so the buttons still work.
  function isBlockedByFraming(err){
    return err && (err.name === 'SecurityError' || err.name === 'NotAllowedError');
  }

  function fallBackToDownloadMode(){
    supportsFS = false;
    fileHandle = null;
    els.btnNewFile.style.display = 'none';
    els.supportHint.innerHTML = 'Your browser doesn\'t support direct file editing here (this page is running inside a frame), so "Open existing file" loads a JSON file you pick, and every save downloads an updated copy to your Downloads folder — pick the newest one next time you load.';
    if(records.length === 0){
      setStatus(null, 'No file connected yet');
    }
  }

  // ---------- persistence: fallback (download / upload) ----------
  function loadFallbackFile(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        records = Array.isArray(parsed) ? parsed : [];
        setStatus('linked', 'Loaded "' + file.name + '" — save downloads an updated copy');
        renderCount();
      }catch(e){
        alert('That file isn\'t a valid catalog file.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function downloadFallback(){
    const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'business-cards.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    dirty = false;
    setStatus('linked', 'Downloaded an updated copy to your Downloads folder');
  }

  async function persist(){
    if(supportsFS && fileHandle){
      await writeToHandle();
    } else if(supportsFS && !fileHandle){
      setStatus('unsaved', 'Choose "Start new file" or "Open existing file" to save this card');
    } else {
      downloadFallback();
    }
  }

  // ---------- form <-> record ----------
  function readForm(){
    return {
      name: els.name.value.trim(),
      type: els.type.value.trim(),
      phone: els.phone.value.trim(),
      email: els.email.value.trim(),
      website: els.website.value.trim(),
      address: els.address.value.trim(),
    };
  }

  function fillForm(rec){
    els.name.value = rec.name || '';
    els.type.value = rec.type || '';
    els.phone.value = rec.phone || '';
    els.email.value = rec.email || '';
    els.website.value = rec.website || '';
    els.address.value = rec.address || '';
  }

  function clearForm(){
    fillForm({});
    editingIndex = -1;
    els.cardHeading.textContent = 'New Card';
    els.cardTab.textContent = '＋';
    els.editFlag.style.display = 'none';
    els.btnDelete.style.display = 'none';
    els.name.focus();
  }

  function openRecordByIndex(idx){
    const rec = records[idx];
    if(!rec) return;
    fillForm(rec);
    editingIndex = idx;
    els.cardHeading.textContent = rec.name;
    els.cardTab.textContent = (rec.name || '?').trim().charAt(0).toUpperCase() || '?';
    els.editFlag.style.display = 'inline-block';
    els.btnDelete.style.display = 'inline-block';
    closeDialog();
    els.name.scrollIntoView({behavior:'smooth', block:'start'});
  }

  // ---------- save / delete ----------
  async function saveRecord(){
    const rec = readForm();
    if(!rec.name){
      alert('Business name is required.');
      els.name.focus();
      return;
    }
    if(editingIndex >= 0){
      records[editingIndex] = rec;
    }else{
      records.push(rec);
      editingIndex = records.length - 1;
    }
    renderCount();
    els.cardHeading.textContent = rec.name;
    els.cardTab.textContent = rec.name.charAt(0).toUpperCase();
    els.editFlag.style.display = 'inline-block';
    els.btnDelete.style.display = 'inline-block';
    await persist();
  }

  async function deleteRecord(){
    if(editingIndex < 0) return;
    const rec = records[editingIndex];
    if(!confirm('Delete the card for "' + rec.name + '"? This can\'t be undone.')) return;
    records.splice(editingIndex, 1);
    clearForm();
    renderCount();
    await persist();
  }

  // ---------- records dialog ----------
  function renderCount(){
    els.recordCount.textContent = records.length + (records.length === 1 ? ' card saved' : ' cards saved');
  }

  function renderDialogList(filterText){
    const filter = (filterText || '').toLowerCase();
    const sorted = records
      .map((rec, idx) => ({ rec, idx }))
      .filter(({rec}) => (rec.name || '').toLowerCase().includes(filter))
      .sort((a, b) => (a.rec.name || '').localeCompare(b.rec.name || '', undefined, {sensitivity:'base'}));

    els.dlgList.innerHTML = '';
    if(sorted.length === 0){
      const li = document.createElement('li');
      li.innerHTML = '<div class="empty">' + (records.length === 0 ? 'No cards saved yet.' : 'No matches.') + '</div>';
      els.dlgList.appendChild(li);
      return;
    }
    sorted.forEach(({rec, idx}) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.innerHTML = '<span>' + escapeHtml(rec.name || '(untitled)') + '</span><span class="type">' + escapeHtml(rec.type || '') + '</span>';
      btn.addEventListener('click', () => openRecordByIndex(idx));
      li.appendChild(btn);
      els.dlgList.appendChild(li);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function openDialog(){
    els.dlgSearch.value = '';
    renderDialogList('');
    els.dialog.showModal();
    els.dlgSearch.focus();
  }
  function closeDialog(){ els.dialog.close(); }

  // ---------- wire up ----------
  els.btnOpenFile.addEventListener('click', () => {
    if(supportsFS) openExistingFile();
    else els.fallbackInput.click();
  });
  els.btnNewFile.addEventListener('click', startNewFile);
  els.fallbackInput.addEventListener('change', loadFallbackFile);

  els.btnSave.addEventListener('click', saveRecord);
  els.btnClear.addEventListener('click', clearForm);
  els.btnDelete.addEventListener('click', deleteRecord);

  els.btnAllRecords.addEventListener('click', openDialog);
  els.btnCloseDialog.addEventListener('click', closeDialog);
  els.dialog.addEventListener('click', (e) => { if(e.target === els.dialog) closeDialog(); });
  els.dlgSearch.addEventListener('input', () => renderDialogList(els.dlgSearch.value));

  window.addEventListener('beforeunload', (e) => {
    if(dirty){ e.preventDefault(); e.returnValue = ''; }
  });

  renderCount();
})();
</script>
</body>
</html>
