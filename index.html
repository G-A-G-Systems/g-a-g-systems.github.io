
<html>


<head>
<style>

.image-container {
  position: relative; 
  width: 100%;
  height: 100%;
  margin-bottom: 20px;
}

.fade-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  
  /* Initial state is hidden */
  opacity: 0; 

/* Handles the smooth fade transition */
  transition: opacity 2.0s ease-in-out; 
}

/* Class applied by JavaScript to trigger the fade-in */
.fade-image.visible {
  opacity: 1;
}









</style>

</head>



<body>

<center>

<a href="index2s.html">    
<div class="image-container">
  <img src="sun2.png" class="fade-image visible" alt="Image 1">
  <img src="1.jpg" class="fade-image" alt="Image 2">
  <img src="2.jpg" class="fade-image" alt="Image 3">
  <img src="3.jpg" class="fade-image" alt="Image 4"> 
  <img src="b1.jpg" class="fade-image" alt="Image 5">
  <img src="b2.jpg" class="fade-image" alt="Image 2">
    <!-- <img src="https://picsum.photos" class="fade-image" alt="Image 3"> -->
</div>
</a>
    
 <button id="trigger-fade">Next Image</button> 
</center>




<script>

document.addEventListener("DOMContentLoaded", () => {
  const images = document.querySelectorAll(".fade-image");
  const button = document.getElementById("trigger-fade");
  let currentIndex = 0;

  function changeImage() {
    // 1. Fade out the current image by removing the class
    images[currentIndex].classList.remove("visible");

    // 2. Calculate the next index (loops back to 0 at the end)
    currentIndex = (currentIndex + 1) % images.length;

    // 3. Fade in the next image by adding the class
    images[currentIndex].classList.add("visible");
  }

  // Option A: Fade on button click
  button.addEventListener("click", changeImage);

  // Option B: Automatically cycle through images every 4 seconds
  // setInterval(changeImage, 4000);
    setInterval(changeImage, 2000);
});




</script>

</body>
</html>
