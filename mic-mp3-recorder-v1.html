<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP3 Microphone Recorder</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f2f2f2;
    padding-top:60px;
}

h1{
    margin-bottom:30px;
}

button{
    width:120px;
    height:50px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
}

#status{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>MP3 Microphone Recorder</h1>

<button id="startBtn">START</button>
<button id="pauseBtn">PAUSE</button>
<button id="stopBtn">STOP</button>

<div id="status">Ready</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<script>

let mediaRecorder;
let audioChunks = [];
let stream;

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");
const statusDiv = document.getElementById("status");

startBtn.onclick = async () => {

    try {

        if (!mediaRecorder) {

            stream = await navigator.mediaDevices.getUserMedia({
                audio:true
            });

            mediaRecorder = new MediaRecorder(stream);

            audioChunks = [];

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) {
                    audioChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = async () => {

                statusDiv.textContent = "Encoding MP3...";

                const webmBlob = new Blob(
                    audioChunks,
                    { type:'audio/webm' }
                );

                await convertToMP3(webmBlob);

                audioChunks = [];

                if(stream){
                    stream.getTracks().forEach(track => track.stop());
                }

                mediaRecorder = null;

                statusDiv.textContent = "Saved MP3";
            };

            mediaRecorder.start();

            statusDiv.textContent = "Recording...";
        }
        else if(mediaRecorder.state === "paused") {

            mediaRecorder.resume();

            statusDiv.textContent = "Recording...";
        }

    } catch(err) {

        alert("Microphone access denied.");

        console.error(err);
    }
};

pauseBtn.onclick = () => {

    if(mediaRecorder &&
       mediaRecorder.state === "recording") {

        mediaRecorder.pause();

        statusDiv.textContent = "Paused";
    }
};

stopBtn.onclick = () => {

    if(mediaRecorder &&
       (mediaRecorder.state === "recording" ||
        mediaRecorder.state === "paused")) {

        mediaRecorder.stop();
    }
};

async function convertToMP3(audioBlob){

    const audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    const arrayBuffer =
        await audioBlob.arrayBuffer();

    const audioBuffer =
        await audioContext.decodeAudioData(arrayBuffer);

    const samples =
        audioBuffer.getChannelData(0);

    const sampleRate =
        audioBuffer.sampleRate;

    const mp3encoder =
        new lamejs.Mp3Encoder(
            1,
            sampleRate,
            128
        );

    const mp3Data = [];

    const pcm =
        new Int16Array(samples.length);

    for(let i=0;i<samples.length;i++){

        let s =
            Math.max(-1,
            Math.min(1,samples[i]));

        pcm[i] =
            s < 0
            ? s * 32768
            : s * 32767;
    }

    const blockSize = 1152;

    for(let i=0;i<pcm.length;i+=blockSize){

        const chunk =
            pcm.subarray(
                i,
                i + blockSize
            );

        const mp3buf =
            mp3encoder.encodeBuffer(chunk);

        if(mp3buf.length > 0){
            mp3Data.push(mp3buf);
        }
    }

    const end =
        mp3encoder.flush();

    if(end.length > 0){
        mp3Data.push(end);
    }

    const mp3Blob =
        new Blob(
            mp3Data,
            { type:'audio/mp3' }
        );

    const url =
        URL.createObjectURL(mp3Blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "Recording.mp3";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
