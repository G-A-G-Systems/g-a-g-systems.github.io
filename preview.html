<html>







<body>
<!-- 1. Let the user select the file -->
    <b>G A G Systems</b> - HTML-CODEX v1, By George A Georgopoulos<br>
PREVIEW <input type="file" id="filePicker" accept=".html">

<!-- 2. The iframe where it will load -->
<iframe id="viewer" width="100%" height="500px"></iframe>







<script>
  document.getElementById('filePicker').onchange = function(event) {
    const file = event.target.files[0];
    if (file) {
      // Create a temporary "Blob" URL for the selected file
      const blobUrl = URL.createObjectURL(file);
      document.getElementById('viewer').src = blobUrl;
    }
  };
</script>






</body>
</html>
