<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text on Image</title>
<meta name="theme-color" content="#4f46e5">
<script>
window.onerror=function(msg,src,line,col,err){window.parent.postMessage({type:'app-error',message:msg,source:src,lineno:line,colno:col,stack:err&&err.stack||''},'*');};
window.onunhandledrejection=function(e){window.parent.postMessage({type:'app-error',message:'Unhandled promise rejection: '+(e.reason&&e.reason.message||e.reason||'unknown'),stack:e.reason&&e.reason.stack||''},'*');};
window.addEventListener('error',function(e){var t=e&&e.target;if(t&&t!==window&&t.tagName==='SCRIPT'){var u=t.src||'';window.parent.postMessage({type:'app-error',message:'Failed to load script'+(u?': '+u:' (inline module)'),source:u},'*');}},true);
(function(){var _f=window.fetch;window.fetch=function(){var a=arguments,u=typeof a[0]==='string'?a[0]:(a[0]&&a[0].url)||'';var p=_f.apply(this,a);p.then(function(r){if(r.status===500){r.clone().text().then(function(b){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:b},'*');}).catch(function(){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:''},'*');});}}).catch(function(e){window.parent.postMessage({type:'fetch-error',url:u,status:0,body:e.message||'fetch failed'},'*');});return p;};})();

<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{height:100%;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;}
  #stage{background-image:linear-gradient(45deg,#eceef1 25%,transparent 25%),linear-gradient(-45deg,#eceef1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eceef1 75%),linear-gradient(-45deg,transparent 75%,#eceef1 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;}
  .layer-active{outline:2px solid #4f46e5;outline-offset:2px;}
  input[type=range]{accent-color:#4f46e5;}
  input[type=color]{-webkit-appearance:none;appearance:none;border:none;padding:0;background:none;cursor:pointer;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  input[type=color]::-webkit-color-swatch{border:1px solid #d1d5db;border-radius:8px;}
</style>
    <!-- puter-pwa: generated, do not edit -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-title" content="Text">

</head>
<body class="bg-gray-50 text-gray-900">
<div class="min-h-full flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center">
          <i data-lucide="type" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-semibold leading-tight">Text on Image</h1>
          <p class="text-xs text-gray-500 leading-tight">Add captions & download</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="newImageBtn" class="hidden sm:inline-flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 transition">
          <i data-lucide="image-plus" class="w-4 h-4"></i> New image
        </button>
        <button id="downloadBtn" disabled class="inline-flex items-center gap-1.5 text-sm font-medium px-3.5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition">
          <i data-lucide="download" class="w-4 h-4"></i> Download
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 grid lg:grid-cols-[1fr_340px] gap-6">
    <!-- Canvas area -->
    <section class="min-w-0">
      <!-- Empty state -->
      <div id="dropZone" class="rounded-2xl border-2 border-dashed border-gray-300 bg-white flex flex-col items-center justify-center text-center p-10 min-h-[420px] transition">
        <div class="w-16 h-16 rounded-2xl bg-indigo-50 flex items-center justify-center mb-4">
          <i data-lucide="image-up" class="w-8 h-8 text-indigo-600"></i>
        </div>
        <h2 class="text-lg font-semibold">Load an image to begin</h2>
        <p class="text-sm text-gray-500 mt-1 max-w-xs">Drag & drop a photo here, or click below to choose a file.</p>
        <button id="chooseBtn" class="mt-5 inline-flex items-center gap-2 text-sm font-medium px-4 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">
          <i data-lucide="upload" class="w-4 h-4"></i> Choose image
        </button>
        <input id="fileInput" type="file" accept="image/*" class="hidden">
      </div>

      <!-- Editor stage -->
      <div id="editorWrap" class="hidden">
        <div id="stage" class="relative rounded-2xl border border-gray-200 overflow-hidden inline-block max-w-full select-none align-top">
          <img id="baseImg" class="block max-w-full" alt="editing">
          <div id="overlay" class="absolute inset-0"></div>
        </div>
        <p class="text-xs text-gray-500 mt-3 flex items-center gap-1.5"><i data-lucide="move" class="w-3.5 h-3.5"></i> Drag any text to reposition it. Click a text to select and edit it.</p>
      </div>
    </section>

    <!-- Controls -->
    <aside class="lg:sticky lg:top-24 self-start space-y-4">
      <div class="bg-white rounded-2xl border border-gray-200 p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i> Text layers</h3>
          <button id="addTextBtn" disabled class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
          </button>
        </div>
        <ul id="layerList" class="space-y-1.5 max-h-40 overflow-auto -mx-1 px-1">
          <li class="text-xs text-gray-400 py-2 text-center">No text yet</li>
        </ul>
      </div>

      <div id="editPanel" class="bg-white rounded-2xl border border-gray-200 p-4 space-y-4 opacity-40 pointer-events-none">
        <h3 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="settings-2" class="w-4 h-4 text-indigo-600"></i> Selected text</h3>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5">Text</label>
          <textarea id="textContent" rows="2" class="w-full text-sm rounded-lg border border-gray-200 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none" placeholder="Type here..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5">Font</label>
          <select id="fontFamily" class="w-full text-sm rounded-lg border border-gray-200 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white"></select>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-medium text-gray-600">Size</label>
            <span id="sizeVal" class="text-xs text-gray-500 tabular-nums">48px</span>
          </div>
          <input id="fontSize" type="range" min="8" max="240" value="48" class="w-full">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1.5">Color</label>
            <div class="flex items-center gap-2">
              <input id="fontColor" type="color" value="#ffffff" class="w-9 h-9 rounded-lg">
              <input id="fontColorHex" type="text" class="flex-1 min-w-0 text-sm rounded-lg border border-gray-200 px-2 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none uppercase" value="#FFFFFF">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1.5">Weight</label>
            <select id="fontWeight" class="w-full text-sm rounded-lg border border-gray-200 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
              <option value="400">Regular</option>
              <option value="600">Semibold</option>
              <option value="700" selected>Bold</option>
              <option value="900">Black</option>
            </select>
          </div>
        </div>

        <div>
          <label class="flex items-center justify-between text-xs font-medium text-gray-600 mb-2">
            <span class="flex items-center gap-1.5"><i data-lucide="pen-line" class="w-3.5 h-3.5"></i> Outline</span>
            <input id="strokeToggle" type="checkbox" class="w-4 h-4 accent-indigo-600">
          </label>
          <div class="flex items-center gap-2">
            <input id="strokeColor" type="color" value="#000000" class="w-9 h-9 rounded-lg">
            <input id="strokeWidth" type="range" min="0" max="20" value="3" class="flex-1">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button id="duplicateBtn" class="inline-flex items-center justify-center gap-1.5 text-xs font-medium px-3 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 transition">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Duplicate
          </button>
          <button id="deleteBtn" class="inline-flex items-center justify-center gap-1.5 text-xs font-medium px-3 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
          </button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script type="module">
import { createIcons, icons } from 'https://cdn.jsdelivr.net/npm/lucide@latest/+esm';

const FONTS = ['Inter','Arial','Helvetica','Georgia','Times New Roman','Courier New','Verdana','Impact','Comic Sans MS','Trebuchet MS','Palatino Linotype'];

const el = id => document.getElementById(id);
const dropZone = el('dropZone'), editorWrap = el('editorWrap'), baseImg = el('baseImg'), overlay = el('overlay');
const fileInput = el('fileInput');

let layers = [];   // {id, text, x, y, size, color, family, weight, stroke, strokeColor, strokeWidth, el}
let activeId = null;
let uid = 1;
let imgNaturalW = 0, imgNaturalH = 0;
let imgFileName = 'image';

// populate font select
const fontSel = el('fontFamily');
FONTS.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; o.style.fontFamily = f; fontSel.appendChild(o); });

/* ---------- Image loading ---------- */
function loadFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  imgFileName = (file.name || 'image').replace(/\.[^.]+$/, '');
  const reader = new FileReader();
  reader.onload = e => {
    baseImg.onload = () => {
      imgNaturalW = baseImg.naturalWidth;
      imgNaturalH = baseImg.naturalHeight;
      dropZone.classList.add('hidden');
      editorWrap.classList.remove('hidden');
      el('addTextBtn').disabled = false;
      el('downloadBtn').disabled = false;
      // reset layers on new image
      layers.forEach(l => l.el.remove());
      layers = []; activeId = null;
      renderLayerList();
      updateEditPanel();
      // add a starter text
      addText('Your text');
    };
    baseImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
el('chooseBtn').addEventListener('click', () => fileInput.click());
el('newImageBtn').addEventListener('click', () => fileInput.click());

['dragover','dragenter'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('border-indigo-400','bg-indigo-50'); }));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('border-indigo-400','bg-indigo-50'); }));
dropZone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; loadFile(f); });

/* ---------- Layer model ---------- */
function addText(initial){
  const l = {
    id: uid++,
    text: initial || 'New text',
    x: 0.5, y: 0.5,      // relative position (center)
    size: 48,
    color: '#ffffff',
    family: 'Inter',
    weight: '700',
    stroke: true,
    strokeColor: '#000000',
    strokeWidth: 3
  };
  const div = document.createElement('div');
  div.className = 'absolute cursor-move whitespace-pre-wrap leading-tight';
  div.style.transform = 'translate(-50%,-50%)';
  l.el = div;
  overlay.appendChild(div);
  attachDrag(l);
  layers.push(l);
  selectLayer(l.id);
  renderLayerList();
  renderLayer(l);
}

function currentLayer(){ return layers.find(l => l.id === activeId); }

function renderLayer(l){
  const scale = baseImg.clientWidth / imgNaturalW || 1;
  const div = l.el;
  div.textContent = l.text || ' ';
  div.style.left = (l.x * 100) + '%';
  div.style.top = (l.y * 100) + '%';
  div.style.fontFamily = "'" + l.family + "'";
  div.style.fontWeight = l.weight;
  div.style.color = l.color;
  div.style.fontSize = (l.size * scale) + 'px';
  if(l.stroke && l.strokeWidth > 0){
    const w = l.strokeWidth * scale;
    div.style.webkitTextStroke = w + 'px ' + l.strokeColor;
    div.style.paintOrder = 'stroke fill';
  } else {
    div.style.webkitTextStroke = '';
  }
  div.classList.toggle('layer-active', l.id === activeId);
}

function renderAll(){ layers.forEach(renderLayer); }

/* ---------- Selection & list ---------- */
function selectLayer(id){
  activeId = id;
  layers.forEach(l => l.el.classList.toggle('layer-active', l.id === id));
  renderLayerList();
  updateEditPanel();
}

function renderLayerList(){
  const list = el('layerList');
  if(layers.length === 0){ list.innerHTML = '<li class="text-xs text-gray-400 py-2 text-center">No text yet</li>'; return; }
  list.innerHTML = '';
  layers.forEach(l => {
    const li = document.createElement('li');
    li.className = 'flex items-center gap-2 px-2.5 py-2 rounded-lg cursor-pointer text-sm ' + (l.id === activeId ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-gray-50');
    li.innerHTML = `<i data-lucide="type" class="w-3.5 h-3.5 shrink-0"></i><span class="truncate flex-1">${(l.text||'(empty)').slice(0,28) || '(empty)'}</span>`;
    li.addEventListener('click', () => selectLayer(l.id));
    list.appendChild(li);
  });
  createIcons({ icons });
}

function updateEditPanel(){
  const panel = el('editPanel');
  const l = currentLayer();
  if(!l){ panel.classList.add('opacity-40','pointer-events-none'); return; }
  panel.classList.remove('opacity-40','pointer-events-none');
  el('textContent').value = l.text;
  fontSel.value = l.family;
  el('fontSize').value = l.size;
  el('sizeVal').textContent = l.size + 'px';
  el('fontColor').value = l.color;
  el('fontColorHex').value = l.color.toUpperCase();
  el('fontWeight').value = l.weight;
  el('strokeToggle').checked = l.stroke;
  el('strokeColor').value = l.strokeColor;
  el('strokeWidth').value = l.strokeWidth;
}

/* ---------- Controls wiring ---------- */
el('addTextBtn').addEventListener('click', () => addText('New text'));

el('textContent').addEventListener('input', e => { const l=currentLayer(); if(!l)return; l.text=e.target.value; renderLayer(l); renderLayerList(); });
fontSel.addEventListener('change', e => { const l=currentLayer(); if(!l)return; l.family=e.target.value; renderLayer(l); });
el('fontSize').addEventListener('input', e => { const l=currentLayer(); if(!l)return; l.size=+e.target.value; el('sizeVal').textContent=l.size+'px'; renderLayer(l); });
el('fontWeight').addEventListener('change', e => { const l=currentLayer(); if(!l)return; l.weight=e.target.value; renderLayer(l); });
el('fontColor').addEventListener('input', e => { const l=currentLayer(); if(!l)return; l.color=e.target.value; el('fontColorHex').value=e.target.value.toUpperCase(); renderLayer(l); });
el('fontColorHex').addEventListener('input', e => { const l=currentLayer(); if(!l)return; let v=e.target.value.trim(); if(/^#?[0-9a-fA-F]{6}$/.test(v)){ if(v[0]!=='#')v='#'+v; l.color=v; el('fontColor').value=v; renderLayer(l);} });
el('strokeToggle').addEventListener('change', e => { const l=currentLayer(); if(!l)return; l.stroke=e.target.checked; renderLayer(l); });
el('strokeColor').addEventListener('input', e => { const l=currentLayer(); if(!l)return; l.strokeColor=e.target.value; renderLayer(l); });
el('strokeWidth').addEventListener('input', e => { const l=currentLayer(); if(!l)return; l.strokeWidth=+e.target.value; renderLayer(l); });

el('deleteBtn').addEventListener('click', () => {
  const l=currentLayer(); if(!l)return;
  l.el.remove();
  layers = layers.filter(x => x.id !== l.id);
  activeId = layers.length ? layers[layers.length-1].id : null;
  layers.forEach(x => x.el.classList.toggle('layer-active', x.id===activeId));
  renderLayerList(); updateEditPanel();
});

el('duplicateBtn').addEventListener('click', () => {
  const l=currentLayer(); if(!l)return;
  const copy = {...l, id: uid++, x: Math.min(0.95, l.x+0.04), y: Math.min(0.95, l.y+0.04)};
  const div = document.createElement('div');
  div.className = 'absolute cursor-move whitespace-pre-wrap leading-tight';
  div.style.transform = 'translate(-50%,-50%)';
  copy.el = div; overlay.appendChild(div); attachDrag(copy);
  layers.push(copy); selectLayer(copy.id); renderLayer(copy); renderLayerList();
});

/* ---------- Dragging ---------- */
function attachDrag(l){
  let dragging = false;
  const start = e => {
    dragging = true; selectLayer(l.id);
    e.preventDefault();
    const move = ev => {
      if(!dragging) return;
      const pt = ev.touches ? ev.touches[0] : ev;
      const rect = overlay.getBoundingClientRect();
      l.x = Math.min(1, Math.max(0, (pt.clientX - rect.left) / rect.width));
      l.y = Math.min(1, Math.max(0, (pt.clientY - rect.top) / rect.height));
      renderLayer(l);
    };
    const end = () => { dragging=false; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',end); document.removeEventListener('touchmove',move); document.removeEventListener('touchend',end); };
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',end);
    document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',end);
  };
  l.el.addEventListener('mousedown', start);
  l.el.addEventListener('touchstart', start, {passive:false});
}

window.addEventListener('resize', renderAll);

/* ---------- Export / download ---------- */
function wrapText(ctx, text){
  // preserve manual line breaks
  return text.split('\n');
}

el('downloadBtn').addEventListener('click', () => {
  if(!imgNaturalW) return;
  const canvas = document.createElement('canvas');
  canvas.width = imgNaturalW; canvas.height = imgNaturalH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(baseImg, 0, 0, imgNaturalW, imgNaturalH);

  layers.forEach(l => {
    ctx.font = `${l.weight} ${l.size}px '${l.family}'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const lines = wrapText(ctx, l.text || '');
    const lineHeight = l.size * 1.1;
    const totalH = lineHeight * lines.length;
    const cx = l.x * imgNaturalW;
    const startY = l.y * imgNaturalH - totalH/2 + lineHeight/2;
    lines.forEach((line, i) => {
      const y = startY + i*lineHeight;
      if(l.stroke && l.strokeWidth > 0){
        ctx.strokeStyle = l.strokeColor;
        ctx.lineWidth = l.strokeWidth * 2;
        ctx.strokeText(line, cx, y);
      }
      ctx.fillStyle = l.color;
      ctx.fillText(line, cx, y);
    });
  });

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = imgFileName + '-text.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
});

// deselect when clicking empty overlay
overlay.addEventListener('mousedown', e => { if(e.target === overlay){ activeId=null; layers.forEach(l=>l.el.classList.remove('layer-active')); renderLayerList(); updateEditPanel(); } });

createIcons({ icons });
</script>
</body>
</html>
